<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="dcms-workbench-revision" content="0.10.5">
<title>DCMS Form / Validation Revision Workspace Prototype v0.10.5</title>
<style>:root {
  --blue: #1682f3;
  --blue2: #0d6fe8;
  --text: #222b36;
  --muted: #66717f;
  --line: #dbe1e8;
  --line2: #cfd7df;
  --head: #050505;
  --bg: #fff;
  --soft: #f7f9fb;
  --success: #237c4b;
  --warning: #a86400;
  --danger: #d42e3a;
  font-family: Inter, "Segoe UI", Arial, sans-serif;
  color: var(--text);
  background: white;
  font-size: 13px;
}
* {
  box-sizing: border-box;
}
body {
  margin: 0;
  background: #fff;
  color: #262d36;
  min-width: 820px;
}
button,
input,
select,
textarea {
  font: inherit;
}
button {
  cursor: pointer;
}
.app-shell {
  min-height: 100vh;
  background: #fff;
}
.app-header {
  height: 74px;
  border-bottom: 1px solid #e2e6eb;
  display: grid;
  grid-template-columns: minmax(270px, 1fr) minmax(420px, 1.25fr) minmax(
      250px,
      1fr
    );
  align-items: center;
  padding: 0 14px 0 12px;
  position: sticky;
  top: 0;
  background: white;
  z-index: 20;
  box-shadow: 0 1px 3px #00000008;
}
.header-left,
.header-actions {
  display: flex;
  align-items: center;
  gap: 10px;
}
.header-actions {
  justify-content: flex-end;
}
.header-center {
  text-align: center;
  position: relative;
}
.editing-user {
  font-size: 11px;
  color: #39414a;
  margin-bottom: 0;
}
.header-title {
  font-weight: 700;
  font-size: 18px;
  line-height: 20px;
}
.header-meta {
  position: absolute;
  right: 0;
  top: 0;
  transform: translateX(50%);
  text-align: right;
  font-size: 9px;
  color: #4f5965;
  line-height: 14px;
  white-space: nowrap;
}
.header-meta span {
  color: #6a7480;
}
.blue-title {
  color: #0075ea;
  font-size: 18px;
}
.preview-title-only .header-title {
  font-size: 18px;
}
.icon-circle {
  width: 30px;
  height: 30px;
  border-radius: 50%;
  border: 0;
  background: #eaf4ff;
  color: #0874e7;
  font-size: 27px;
  line-height: 26px;
  display: grid;
  place-items: center;
  padding: 0;
}
.table-menu {
  height: 32px;
  border: 0;
  border-radius: 4px;
  background: #5d6874;
  color: white;
  padding: 0 11px;
  font-size: 11px;
}
.icon-square {
  position: relative;
  height: 32px;
  min-width: 32px;
  border: 1px solid #d8dee5;
  border-radius: 4px;
  background: #f9fafc;
  color: #167fe9;
}
.notice-dot {
  position: absolute;
  width: 7px;
  height: 7px;
  background: #1484ff;
  border-radius: 50%;
  right: -2px;
  top: -2px;
  border: 1px solid white;
}
.outline-blue,
.primary-blue {
  height: 32px;
  border-radius: 4px;
  padding: 0 18px;
  font-weight: 600;
  font-size: 11px;
}
.outline-blue {
  border: 1px solid #1682f3;
  color: #0d6fe8;
  background: white;
}
.primary-blue {
  border: 1px solid #0875e7;
  background: #0875e7;
  color: #fff;
}
.view-radio {
  font-size: 10px;
  display: flex;
  align-items: center;
  gap: 4px;
  color: #46505c;
}
.view-radio input {
  accent-color: #187eef;
}
.preview-left {
  gap: 15px;
}
#main {
  min-height: calc(100vh - 74px);
}
.editor-page {
  padding: 18px 15px 60px;
  max-width: 1760px;
  margin: 0 auto;
}
.field-block {
  margin-bottom: 20px;
}
.field-block > label {
  display: block;
  font-weight: 600;
  font-size: 11px;
  margin-bottom: 7px;
}
.readonly-id {
  width: 290px;
  height: 33px;
  border: 1px solid #cfd7df;
  border-radius: 3px;
  padding: 6px 10px;
  color: #79838f;
  background: #fbfcfd;
}
.rich-block {
  margin-top: 8px;
}
.rich-editor {
  height: 122px;
  border: 1px solid #cdd5de;
  border-radius: 3px;
  background: #fff;
}
.rich-toolbar {
  height: 35px;
  border-bottom: 1px solid #eef1f4;
  display: flex;
  align-items: center;
  gap: 9px;
  padding: 0 18px;
  color: #6a747f;
  font-size: 10px;
  white-space: nowrap;
}
.rich-toolbar .sep {
  height: 15px;
  width: 1px;
  background: #e1e5ea;
}
.rich-toolbar .font-size {
  border: 1px solid #d7dce3;
  padding: 3px 6px;
  border-radius: 2px;
}
.rich-content {
  height: 84px;
  padding: 8px 12px;
  outline: none;
  font-size: 12px;
}
.section-title-row {
  margin-top: 28px;
  display: flex;
  justify-content: space-between;
  align-items: flex-end;
}
.section-title-row h2 {
  font-size: 14px;
  margin: 0 0 8px;
}
.load-template {
  font-size: 10px;
  color: #fff;
  background: #bcc3ca;
  border: 0;
  border-radius: 3px;
  padding: 5px 15px;
}
.form-table-wrap {
  border-top: 1px solid #d9dfe5;
  overflow: auto;
  max-height: 55vh;
}
.form-table {
  width: 100%;
  border-collapse: collapse;
  table-layout: fixed;
  min-width: 1150px;
}
.form-table thead th {
  background: #020202;
  color: white;
  text-align: left;
  font-size: 9px;
  padding: 7px 6px;
  height: 44px;
  border-right: 1px solid #4e4e4e;
  position: sticky;
  top: 0;
  z-index: 3;
}
.form-table thead th:nth-child(1) {
  width: 48px;
}
.form-table thead th:nth-child(2) {
  width: 95px;
}
.form-table thead th:nth-child(3) {
  width: 36%;
}
.form-table thead th:nth-child(4) {
  width: 145px;
}
.form-table thead th:nth-child(5) {
  width: 160px;
}
.form-table thead th:nth-child(6) {
  width: 82px;
}
.form-table thead th:nth-child(7) {
  width: 78px;
}
.form-table thead th:nth-child(8) {
  width: 82px;
}
.form-table td {
  border-right: 1px solid #d5dce3;
  border-bottom: 1px solid #d5dce3;
  padding: 7px 7px;
  vertical-align: middle;
  background: #fff;
  font-size: 10px;
}
.form-table tr.row-blocking td {
  background: #fffafa;
}
.form-table tr.row-warning td {
  background: #fffdf7;
}
.form-table tr.row-error td {
  background: #fff7f7;
}
.order-cell {
  text-align: center;
}
.drag {
  font-size: 15px;
  color: #687583;
}
.cell-select {
  border: 0;
  background: transparent;
  color: #38424d;
  font-size: 10px;
  max-width: 100%;
  padding: 3px;
}
.label-editor {
  width: 100%;
  border: 0;
  resize: none;
  outline: none;
  font-size: 10px;
  line-height: 14px;
  padding: 1px;
  background: transparent;
  color: #252c35;
}
.option-stack {
  display: flex;
  flex-direction: column;
  gap: 4px;
}
.option-input {
  height: 24px;
  border: 1px solid #cfd5dc;
  border-radius: 2px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding-left: 6px;
  background: #fff;
}
.option-input button {
  height: 18px;
  width: 20px;
  border: 1px solid #ff3345;
  color: #e92338;
  background: #fff;
  border-radius: 2px;
  padding: 0;
  font-size: 8px;
}
.option-add,
.validation-btn {
  height: 24px;
  border: 1px solid #1682f3;
  color: #0875e7;
  background: #fff;
  border-radius: 2px;
  font-size: 9px;
  white-space: nowrap;
}
.option-add {
  width: 100%;
}
.option-empty {
  min-width: 90px;
}
.validation-btn {
  width: 100%;
  padding: 0 5px;
}
.row-status {
  font-size: 8px;
  margin-top: 3px;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.row-status.pass {
  color: #288051;
}
.row-status.blocking,
.row-status.error {
  color: #b52330;
}
.row-status.warning {
  color: #986500;
}
.must-cell {
  text-align: center;
}
.must-cell label {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 4px;
}
.must-cell input {
  width: 12px;
  height: 12px;
  accent-color: #1280ec;
}
.value-cell {
  width: 100%;
  height: 24px;
  border: 1px solid #b9c2cb;
  border-radius: 2px;
  padding: 2px 5px;
  font-size: 9px;
}
.action-cell {
  text-align: center;
  white-space: nowrap;
}
.action-cell button {
  width: 25px;
  height: 25px;
  border-radius: 4px;
  padding: 0;
  margin: 0 2px;
  font-size: 12px;
}
.edit-action {
  border: 0;
  background: #1587f4;
  color: #fff;
}
.delete-action,
.rule-delete {
  border: 0;
  background: #ef3340;
  color: #fff;
}
.add-row {
  margin-top: 7px;
  background: #5f6872;
  color: #fff;
  border: 0;
  border-radius: 3px;
  padding: 5px 10px;
  font-size: 9px;
}
.prototype-panel {
  position: fixed;
  left: 14px;
  right: 14px;
  bottom: 10px;
  z-index: 15;
  background: #ffffffee;
  border: 1px solid #d7dee6;
  border-radius: 6px;
  box-shadow: 0 7px 30px #2030401f;
  backdrop-filter: blur(8px);
  font-size: 10px;
}
.prototype-panel summary {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 7px 10px;
  cursor: pointer;
  color: #4f5b66;
}
.prototype-panel summary span {
  color: #89939d;
}
.prototype-grid {
  display: grid;
  grid-template-columns: 220px 230px 1fr auto;
  gap: 10px;
  align-items: end;
  padding: 8px 10px 10px;
  border-top: 1px solid #eef1f4;
}
.prototype-grid label {
  display: flex;
  flex-direction: column;
  gap: 4px;
  color: #5a6570;
}
.prototype-grid select,
.prototype-grid input {
  height: 28px;
  border: 1px solid #cbd3dc;
  border-radius: 3px;
  padding: 3px 6px;
  background: white;
}
.seed-row {
  display: flex;
}
.seed-row input {
  flex: 1;
  min-width: 0;
  border-radius: 3px 0 0 3px;
}
.seed-row button {
  border: 1px solid #b8c2cd;
  border-left: 0;
  background: #f5f7f9;
  border-radius: 0 3px 3px 0;
}
.evidence-cards {
  display: grid;
  grid-template-columns: repeat(9, minmax(58px, 1fr));
  gap: 3px;
}
.evidence-cards > div {
  border: 1px solid #e0e5ea;
  border-radius: 3px;
  padding: 4px 5px;
  text-align: center;
  background: #fbfcfd;
}
.evidence-cards b {
  display: block;
  font-size: 10px;
}
.evidence-cards span {
  display: block;
  color: #77828e;
  font-size: 7px;
  white-space: nowrap;
}
.prototype-actions {
  display: flex;
  gap: 4px;
}
.prototype-actions button {
  height: 28px;
  border: 1px solid #b9c4ce;
  background: white;
  border-radius: 3px;
  font-size: 9px;
  padding: 0 7px;
}
.prototype-actions .submit-sim {
  background: #0875e7;
  color: #fff;
  border-color: #0875e7;
}
.prototype-actions button:disabled {
  opacity: 0.45;
  cursor: not-allowed;
}
.prototype-note {
  grid-column: 1/-1;
  margin: 0;
  color: #68737e;
  font-size: 8px;
}
.prototype-note code {
  font-family: Consolas, monospace;
}
.modal-backdrop {
  position: fixed;
  inset: 0;
  background: #0000007d;
  z-index: 50;
  display: none;
  align-items: center;
  justify-content: center;
  padding: 25px;
}
.modal-backdrop.show {
  display: flex;
}
.validation-modal {
  width: min(1450px, 96vw);
  height: min(570px, 90vh);
  background: white;
  border-radius: 8px;
  box-shadow: 0 22px 80px #00000055;
  display: flex;
  flex-direction: column;
  overflow: hidden;
}
.modal-titlebar {
  height: 55px;
  border-bottom: 1px solid #e3e7eb;
  display: flex;
  align-items: center;
  padding: 0 14px;
  position: relative;
}
.modal-titlebar h2 {
  font-size: 16px;
  margin: 0 auto;
}
.modal-back {
  position: absolute;
  left: 15px;
}
.modal-x {
  position: absolute;
  right: 18px;
  border: 0;
  background: transparent;
  color: #5f6770;
  font-size: 24px;
}
.modal-content {
  padding: 15px 18px;
  overflow: auto;
  flex: 1;
}
.modal-context {
  display: grid;
  grid-template-columns: 130px 280px;
  gap: 18px;
  margin-bottom: 16px;
}
.modal-context label {
  display: flex;
  flex-direction: column;
  gap: 5px;
  font-size: 9px;
}
.modal-context select,
.modal-context input {
  height: 30px;
  border: 1px solid #d2d8df;
  border-radius: 3px;
  padding: 4px 7px;
  color: #7b858f;
  background: #fff;
  font-size: 9px;
}
.rule-table-wrap {
  overflow: auto;
  max-height: 330px;
}
.rule-table {
  width: 100%;
  border-collapse: collapse;
  min-width: 980px;
}
.rule-table th {
  background: #030303;
  color: #fff;
  text-align: left;
  padding: 8px 7px;
  font-size: 9px;
  border-right: 1px solid #444;
  position: sticky;
  top: 0;
  z-index: 2;
}
.rule-table td {
  border-right: 1px solid #d5dce3;
  border-bottom: 1px solid #d5dce3;
  padding: 5px;
  vertical-align: top;
}
.rule-table select,
.rule-table input {
  width: 100%;
  height: 28px;
  border: 0;
  background: #fff;
  padding: 3px 5px;
  font-size: 9px;
}
.rule-table td:nth-child(1) {
  width: 90px;
}
.rule-table td:nth-child(2) {
  width: 250px;
}
.rule-table td:nth-child(3) {
  width: 210px;
}
.rule-table td:nth-child(4) {
  width: 300px;
}
.rule-table td:nth-child(5) {
  width: 95px;
  text-align: center;
}
.rule-table td:nth-child(6) {
  width: 55px;
  text-align: center;
}
.rule-table small {
  display: block;
  color: #9ba4ad;
  font-size: 7px;
  margin: 2px 5px;
}
.case-cell input {
  width: 13px;
  height: 13px;
  accent-color: #1783f1;
}
.rule-delete {
  width: 22px;
  height: 22px;
  border-radius: 3px;
  padding: 0;
  font-size: 9px;
}
.modal-add {
  margin-top: 6px;
  background: #626b75;
  color: #fff;
  border: 0;
  border-radius: 3px;
  padding: 5px 10px;
  font-size: 9px;
}
.diag {
  min-height: 12px;
  font-size: 7px;
  color: #85909b;
  padding: 0 5px 2px;
  line-height: 10px;
}
.diag.valid {
  color: #3d8a5f;
}
.diag.incomplete,
.diag.invalid {
  color: #d33442;
}
.diag.warning {
  color: #a86b00;
}
.modal-summary {
  margin-top: 8px;
  border-radius: 3px;
  padding: 6px 8px;
  font-size: 8px;
}
.modal-summary.good {
  background: #eef8f2;
  color: #2e714b;
}
.modal-summary.warn {
  background: #fff7e8;
  color: #916100;
}
.modal-summary.bad {
  background: #fff0f1;
  color: #a42935;
}
.modal-footer {
  height: 55px;
  border-top: 1px solid #e2e7ec;
  display: flex;
  justify-content: flex-end;
  gap: 10px;
  align-items: center;
  padding: 0 16px;
}
.outline-red {
  height: 30px;
  border: 1px solid #fa4957;
  background: #fff;
  color: #e52c3c;
  border-radius: 4px;
  padding: 0 16px;
  font-size: 9px;
}
.preview-mode #main {
  background: #fff;
}
.preview-page {
  position: relative;
  min-height: calc(100vh - 74px);
  padding: 64px 0 110px;
}
.preview-form {
  width: 730px;
  max-width: calc(100vw - 180px);
  margin: 0 auto;
}
.preview-field {
  margin-bottom: 19px;
}
.preview-label {
  display: block;
  font-size: 10px;
  color: #505a66;
  margin-bottom: 7px;
  line-height: 15px;
}
.choice-row {
  display: flex;
  gap: 25px;
  align-items: center;
  font-size: 9px;
  color: #65707b;
}
.choice-row label {
  display: flex;
  gap: 5px;
  align-items: center;
}
.choice-row input {
  width: 11px;
  height: 11px;
  accent-color: #1480ed;
}
.underline-input {
  border: 0;
  border-bottom: 1px solid #2a9aff;
  outline: 0;
  width: 180px;
  height: 23px;
  padding: 2px 0;
  font-size: 10px;
  color: #313a44;
  background: transparent;
}
.preview-feedback {
  font-size: 8px;
  margin-top: 4px;
  max-width: 500px;
}
.preview-feedback.blocking,
.preview-feedback.error {
  color: #c62f3d;
}
.preview-feedback.warning {
  color: #9d6c00;
}
.proprietary-box {
  position: absolute;
  left: 17px;
  bottom: 120px;
  border: 1px solid #d8dfe6;
  padding: 10px 12px;
  font-size: 7px;
  text-align: center;
  color: #68737e;
  line-height: 10px;
}
.zoom-box {
  position: absolute;
  right: 15px;
  bottom: 120px;
  border: 1px solid #dfe4e9;
  border-radius: 4px;
  display: flex;
  align-items: center;
  background: #fff;
  overflow: hidden;
}
.zoom-box button {
  width: 28px;
  height: 28px;
  border: 0;
  background: #fff;
  color: #6f7a85;
  font-size: 16px;
}
.zoom-box span {
  font-size: 8px;
  color: #7d8791;
  padding: 0 8px;
  border-left: 1px solid #e7ebef;
  border-right: 1px solid #e7ebef;
}
.toast {
  position: fixed;
  right: 18px;
  top: 88px;
  z-index: 80;
  max-width: 520px;
  background: #26313d;
  color: white;
  padding: 10px 14px;
  border-radius: 5px;
  box-shadow: 0 8px 24px #0003;
  opacity: 0;
  transform: translateY(-8px);
  pointer-events: none;
  transition: 0.18s;
  font-size: 10px;
  line-height: 14px;
}
.toast.show {
  opacity: 1;
  transform: none;
}
.toast.success {
  background: #236f49;
}
.toast.warning {
  background: #8a6100;
}
.toast.error {
  background: #a92834;
}
.toast.info {
  background: #2d4f73;
}
@media (max-width: 1200px) {
  .app-header {
    grid-template-columns: 280px 1fr 190px;
  }
  .header-meta {
    display: none;
  }
  .prototype-grid {
    grid-template-columns: 190px 210px 1fr;
  }
  .prototype-actions {
    grid-column: 1/-1;
  }
  .evidence-cards {
    grid-template-columns: repeat(5, 1fr);
  }
  .preview-form {
    width: 640px;
  }
}
/* v0.9.6 Revision / multi-Form Element workspace */
button:disabled {
  opacity: 0.45;
  cursor: not-allowed;
}
.revision-workspace {
  display: grid;
  grid-template-columns: 218px minmax(0, 1fr);
  min-height: calc(100vh - 74px);
  background: #fff;
}
.node-rail {
  border-right: 1px solid #e0e5ea;
  background: #f8fafc;
  position: sticky;
  top: 74px;
  height: calc(100vh - 74px);
  padding: 12px 9px;
  display: flex;
  flex-direction: column;
  z-index: 9;
}
.node-rail-title {
  font-size: 11px;
  font-weight: 700;
  padding: 5px 7px 10px;
  display: flex;
  justify-content: space-between;
  color: #3f4a55;
}
.node-rail-title span {
  background: #e8edf3;
  border-radius: 999px;
  padding: 1px 7px;
  color: #65717d;
}
.node-list {
  overflow: auto;
  display: flex;

  border: 1px solid #efc1c5;
  background: #fff8f8;
  border-radius: 5px;
  padding: 14px;
  color: #8c3038;
  font-size: 9px;
  line-height: 14px;
}
.revision-form-inline > .node-error-text {
  margin: 10px 24px 0;
}
.revision-help {
  font-size: 9px;
  line-height: 14px;
}

@media (max-width: 1200px) {
  .revision-preview-document,
  .revision-preview-record,
  .revision-preview-form,
  .revision-preview-unavailable {
    width: 640px;
    max-width: calc(100% - 36px);
  }
}
.record-rich-editor {
  min-height: 92px;
  max-width: 680px;
  border: 1px solid #c8d7e6;
  border-bottom: 2px solid #2a9aff;
  border-radius: 4px;
  background: #fff;
  padding: 9px 10px;
  outline: none;
  font-size: 10px;
  line-height: 15px;
  color: #313a44;
  overflow: auto;
}
.record-rich-editor:focus {
  box-shadow: 0 0 0 2px #1682f31f;
  border-color: #1682f3;
}
.record-rich-editor p {
  margin: 0 0 6px;
}
.record-rich-editor p:last-child {
  margin-bottom: 0;
}
.record-rich-editor ul,
.record-rich-editor ol {
  margin: 4px 0 6px 18px;
  padding: 0;
}
.record-rich-editor.readonly-rich {
  background: #f8fafc;
  color: #6a747f;
}
.rich-validation-note {
  font-size: 7px;
  color: #7b8793;
  margin-top: 4px;
  line-height: 10px;
}
.preview-field .record-rich-editor {
  width: 100%;
  box-sizing: border-box;
}
.revision-preview-field .record-rich-editor {
  width: 100%;
  box-sizing: border-box;
}
/* Semantic field-state colors: blue=no validation, green=valid, orange=warning, red=blocking; evaluation errors are violet and separate. */
.row-status.unvalidated {
  color: #1d6fb8;
}
.form-table tr.row-error td {
  background: #fcf8ff;
}
.row-status.error {
  color: #7042a8;
}
.preview-feedback.error {
  color: #7042a8;
}
.preview-field.error,
.revision-preview-field.error {
  background: #fcf8ff !important;
  border-left: 2px solid #7b4bb3 !important;
  padding-left: 8px;
}
.preview-field.unvalidated,
.revision-preview-field.unvalidated {
  background: #f7fbff;
  border-left: 2px solid #1682f3;
  padding-left: 8px;
}
.preview-field.guidance-selected.unvalidated,
.revision-preview-field.guidance-selected.unvalidated {
  background: #f7fbff;
  border-left-color: #1682f3;
}
.preview-field.guidance-selected.error,
.revision-preview-field.guidance-selected.error {
  background: #fcf8ff !important;
  border-left-color: #7b4bb3 !important;
}

/* Review v0.10.0: full-width text, visible focus and distinct Record status. */
.underline-input.text-input {
  width: 100%;
  max-width: 730px;
}
.underline-input:focus-visible,
.record-rich-editor:focus-visible {
  outline: 2px solid #1674cf;
  outline-offset: 3px;
}
.choice-row {
  flex-wrap: wrap;
  row-gap: 10px;
}
.record-preview-summary {
  padding: 10px 26px;
  color: #394550;
  background: #f8fafc;
  border-bottom: 1px solid #e3e8ed;
  font-size: 11px;
}

.prototype-panel {
  position: relative;
  left: auto;
  right: auto;
  bottom: auto;
  margin: 16px 14px;
  box-shadow: none;
  z-index: 1;
}
.record-textarea {
  width: 100%;
  min-height: 95px;
  max-height: 240px;
  resize: vertical;
  border: 1px solid #c4d7ed;
  border-radius: 3px;
  padding: 8px;
  font: inherit;
  line-height: 1.5;
  color: #313a44;
}
.record-textarea:focus-visible {
  outline: 2px solid #1674cf;
  outline-offset: 3px;
}

/* Keep Record controls stationary while focus reveals guidance: a mouse-down must not move its click target. */
.preview-field {
  border-left: 2px solid transparent;
  padding-left: 8px;
}
.preview-field .criteria-hint {
  display: block;
  visibility: hidden;
}
.preview-field.guidance-selected .criteria-hint {
  visibility: visible;
}

/* Long authored text must stay inside its own control, never cover the next
   field. Keep full content available through wrapping or local scrolling. */
.rich-content {
  overflow: auto;
  white-space: pre-wrap;
  overflow-wrap: anywhere;
}
.rich-toolbar {
  overflow-x: auto;
}
.rich-toolbar > span {
  flex-shrink: 0;
}
.header-center {
  min-width: 0;
  padding: 0 10px;
}
.header-title {
  max-height: 40px;
  overflow: auto;
  overflow-wrap: anywhere;
}
.header-meta {
  max-width: 300px;
  overflow: hidden;
  text-overflow: ellipsis;
}
.revision-command-context > strong {
  min-width: 0;
  overflow: hidden;
  text-overflow: ellipsis;
}
.node-item {
  min-width: 0;
  grid-template-columns: 11px minmax(0, 1fr);
}
.node-name,
.revision-form-title {
  min-width: 0;
  overflow-wrap: anywhere;
}
.preview-revision-context {
  max-width: calc(100% - 36px);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.preview-document-description,
.preview-record-description,
.revision-preview-document,
.revision-preview-record,
.preview-label,
.choice-row label,
.criteria-hint,
.preview-feedback,
.record-rich-editor,
.diag,
.modal-summary,
.toast-message {
  overflow-wrap: anywhere;
}
.choice-row label {
  max-width: 100%;
  min-width: 0;
}
.choice-row input {
  flex-shrink: 0;
}
.record-rich-editor {
  white-space: pre-wrap;
}
.node-error-text {
  max-height: 120px;
  overflow: auto;
  overflow-wrap: anywhere;
}
.toast {
  max-width: min(560px, calc(100vw - 36px));
  max-height: calc(100vh - 36px);
  overflow: auto;
}
.modal-titlebar,
.modal-footer {
  flex-shrink: 0;
}
.modal-content {
  min-height: 0;
  min-width: 0;
}
.modal-context {
  grid-template-columns: minmax(90px, 130px) minmax(0, 280px);
}
.modal-context label,
.modal-context input,
.modal-context select {
  min-width: 0;
  width: 100%;
}
</style>
</head>
<body>
<div class="app-shell">
  <div id="revisionCommandBar" class="revision-command-bar"></div>
  <header id="appHeader" class="app-header"></header>
  <main id="main"></main>
  <div id="prototypeControls"></div>
</div>
<div id="modalBackdrop" class="modal-backdrop"><section id="validationModal" class="validation-modal" role="dialog" aria-modal="true" aria-label="Validation Rule"></section></div>
<div id="toast" class="toast"></div>
