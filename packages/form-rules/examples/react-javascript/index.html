<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>DCMS React and Express example</title>
<style>body{margin:0;background:#f5f7fa;color:#1b2b3a;font:16px/1.5 system-ui,sans-serif}main{max-width:680px;margin:40px auto;padding:32px;background:#fff;border:1px solid #d6e0e8;border-radius:8px}h1{font-size:30px;margin:8px 0}.eyebrow{font-size:12px;letter-spacing:.12em;color:#466177}.demo-note{font-size:14px;color:#596777}.field{display:grid;grid-template-columns:1fr auto;gap:6px;margin:24px 0}.field>span,.field>small{grid-column:1/-1}.field input{min-width:0;font:inherit;padding:9px 12px;border:1px solid #8ba2b5;border-radius:4px}.field strong{font-size:13px;align-self:center;padding-left:12px}.field small{color:#536578}.blocking strong,.error strong{color:#ad2632}.warning strong{color:#865c00}.valid strong{color:#246140}input:focus-visible,button:focus-visible{outline:3px solid #69a5df;outline-offset:3px}.actions{display:flex;gap:12px}button{font:inherit;padding:10px 16px;border:1px solid #215a90;background:#fff;color:#174b7b;border-radius:4px;cursor:pointer}button:last-child{background:#165b9c;color:#fff}button:disabled{opacity:.45;cursor:default}[data-server-response]{min-height:24px}@media(max-width:760px){main{margin:16px;padding:20px}}</style>
<div id="root"></div><script src="./app.js"></script></html>
