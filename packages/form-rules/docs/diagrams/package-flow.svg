<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="210" viewBox="0 0 1000 210"><style>text{font-family:Arial,sans-serif;fill:#17364a}.title{font-size:18px;font-weight:bold}.sub{font-size:15px}.box{fill:#edf4f7;stroke:#b2c9d4;stroke-width:1.5}.arrow{stroke:#27738a;stroke-width:2;fill:none;marker-end:url(#a)}</style><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6" fill="#27738a"/></marker></defs><rect class="box" x="3" y="60" width="210" height="94" rx="9"/><text x="108" y="92" text-anchor="middle" class="title">JSON definition</text><text x="108" y="121" text-anchor="middle" class="sub">Fields + rules + version</text><path class="arrow" d="M214 107 H280"/><rect class="box" x="287" y="60" width="245" height="94" rx="9"/><text x="409" y="92" text-anchor="middle" class="title">Compile once</text><text x="409" y="121" text-anchor="middle" class="sub">Reusable prepared plan</text><path class="arrow" d="M533 107 H599"/><rect class="box" x="606" y="60" width="391" height="94" rx="9"/><text x="801" y="92" text-anchor="middle" class="title">Evaluate current entered values</text><text x="801" y="121" text-anchor="middle" class="sub">Field states + canSubmit</text><text x="800" y="28" text-anchor="middle" class="sub">Each edit in React; each request in Express</text><path class="arrow" d="M802 35 V54"/><text x="500" y="193" text-anchor="middle" class="sub">The server loads the allowed definition and reevaluates before committing a Record.</text></svg>